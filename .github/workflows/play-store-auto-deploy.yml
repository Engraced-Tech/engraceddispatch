name: Play Store Auto-Deploy CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track to deploy'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - production
          - internal
      release_status:
        description: 'Release rollout status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
      version_code:
        description: 'Custom Version Code (leave empty for auto-increment)'
        required: false
        default: ''
        type: string
      version_name:
        description: 'Custom Version Name (e.g. 1.0.4)'
        required: false
        default: ''
        type: string

concurrency:
  group: play-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compute Build Versioning & Target Track
        id: versioning
        run: |
          # 1. Determine Target Track
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TRACK="production"
            TAG_NAME="${GITHUB_REF#refs/tags/v}"
            DEFAULT_VERSION_NAME="$TAG_NAME"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TRACK="${{ inputs.track }}"
            DEFAULT_VERSION_NAME="1.0.4"
          else
            TRACK="alpha"
            DEFAULT_VERSION_NAME="1.0.4"
          fi

          # 2. Determine Version Name
          if [[ -n "${{ inputs.version_name }}" ]]; then
            FINAL_VERSION_NAME="${{ inputs.version_name }}"
          else
            FINAL_VERSION_NAME="$DEFAULT_VERSION_NAME"
          fi

          # 3. Determine Monotonically Increasing Version Code
          if [[ -n "${{ inputs.version_code }}" ]]; then
            FINAL_VERSION_CODE="${{ inputs.version_code }}"
          else
            # Base offset of 10 + GitHub Run Number guarantees strictly increasing codes
            FINAL_VERSION_CODE=$((10 + GITHUB_RUN_NUMBER))
          fi

          # 4. Determine Status
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FINAL_STATUS="${{ inputs.release_status }}"
          else
            FINAL_STATUS="completed"
          fi

          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "version_name=$FINAL_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$FINAL_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "release_status=$FINAL_STATUS" >> $GITHUB_OUTPUT

          echo "🚀 Configured Release:"
          echo "   • Track: $TRACK"
          echo "   • Status: $FINAL_STATUS"
          echo "   • Version Code: $FINAL_VERSION_CODE"
          echo "   • Version Name: $FINAL_VERSION_NAME"

      - name: Decode Release Keystore
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
            echo "✅ Release keystore restored from secrets."
          else
            echo "⚠️ KEYSTORE_BASE64 secret is not set. Build will use fallback."
          fi

      - name: Build Android App Bundle (AAB) & APK
        working-directory: mobile
        env:
          VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
          VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          KEYSTORE_PATH: "app/release-key.jks"
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          chmod +x gradlew || true
          ./gradlew :app:bundleRelease :app:assembleRelease --console=plain

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esdispatch-v${{ steps.versioning.outputs.version_code }}
          path: |
            mobile/app/build/outputs/bundle/release/app-release.aab
            mobile/app/build/outputs/apk/release/app-release.apk

      - name: Publish to Google Play Store
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: "com.esdispatch.app"
          releaseFiles: mobile/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.versioning.outputs.track }}
          status: ${{ steps.versioning.outputs.release_status }}
          mappingFile: mobile/app/build/outputs/mapping/release/mapping.txt
